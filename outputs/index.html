function coverFor(type,id){if(id&&eventImages[id])return eventImages[id];return type==='exhibition'?'https://images.unsplash.com/photo-1744063427137-8de9a1a0b211?auto=format&fit=crop&w=1600&q=88':type==='livehouse'?'https://prcdn.freetls.fastly.net/release_image/125570/2/125570-2-cc8f866971ead3b70299db804a8a8fb0-3900x2925.jpg?auto=webp&fit=bounds&format=jpeg&height=1350&quality=85':'https://images.unsplash.com/photo-1722570014465-9cdf5839778f?auto=format&fit=crop&w=1600&q=88'}
function eventCard(e){return `<article class="event" onclick="go('detail','${e.id}')"><div class="thumb" style="background-image:linear-gradient(145deg,#0002,#0008),url('${coverFor(e.type,e.id)}')">${esc(e.typeLabel)}</div><div class="eventmain"><h3>${esc(e.title)}</h3><div class="eventline">${esc(e.date)}<br>${esc(e.venue)}<br>已有 ${e.people} 人 · ${e.match} 人找搭子</div><div class="eventactions"><button class="smallbtn" onclick="event.stopPropagation();toggleSave('${e.id}')">${state.saved[e.id]?'已收藏':'收藏'}</button><button class="smallbtn primary" onclick="event.stopPropagation();go('match','${e.id}')">找同好</button></div></div></article>`}
function home(){const list=events.filter(e=>e.type===state.category);const hero=list[0];return `<div class="top"><div class="status"><span>9:41</span><span>▮▮▮　Wi‑Fi</span></div><div class="topbar"><div class="logo">同场*</div><div><button class="icon" aria-label="搜索" onclick="go('search')">⌕</button><button class="icon" onclick="go('notifications')">♧</button><button class="icon" onclick="toggleMenu()">☰</button></div></div><div class="sectiontitle" style="margin:10px 0 2px"><h2>今天，去哪里？</h2></div></div><div class="content"><div class="chips">${[['concert','演唱会'],['exhibition','展览'],['livehouse','Livehouse']].map(([k,l])=>`<button class="chip ${state.category===k?'active':''}" onclick="setCat('${k}')">${l}</button>`).join('')}<button class="chip" onclick="moreCats()">更多</button></div><div class="hero" style="background-image:url('${coverFor(hero.type)}')" onclick="go('detail','${hero.id}')"><small>${hero.typeLabel} · 热门推荐</small><b>${esc(hero.title)}</b><small>${esc(hero.date)} · ${esc(hero.venue)}</small></div><div class="dots">● ○ ○</div><div class="sectiontitle"><h2>热门活动</h2><span class="muted">${list.length} 场推荐</span></div>${list.map(eventCard).join('')}</div>${nav('discover')}`}
function nav(active){return `<nav class="bottom"><button class="${active==='discover'?'active':''}" onclick="go('home')"><i>⌂</i>发现</button><button class="${active==='circle'?'active':''}" onclick="go('circle')"><i>✦</i>圈子</button><button class="${active==='profile'?'active':''}" onclick="go('profile')"><i>◉</i>我的</button></nav>`}
function detail(){const e=events.find(x=>x.id===state.selectedEvent)||events[0];return `<div class="detail-screen"><div class="pagehead"><button class="back" onclick="go('home')">‹</button><div><button class="icon" onclick="toggleSave('${e.id}')">${state.saved[e.id]?'★':'☆'}</button><button class="icon" onclick="toast('已复制活动链接')">↗</button></div></div><div class="content"><div class="detailhero" style="background-image:url('${coverFor(e.type,e.id)}')"><div><small>${e.typeLabel}</small><h1>${esc(e.title)}</h1><small>${esc(e.date)} · ${esc(e.venue)}</small></div></div><div class="panel"><b>活动介绍</b><p class="muted">这是一个适合和同好一起参加的活动。你可以查看现场信息、相关帖子并找到同行搭子。</p><div class="muted">已有 ${e.people} 人关注 · ${e.match} 人正在找搭子</div></div><button class="btn lime" onclick="go('match','${e.id}')">开始找搭子</button><div class="sectiontitle"><h2>相关帖子</h2></div>${posts.filter(p=>p.eventId===e.id).map(postMini).join('')||'<div class="empty">还没有相关帖子，成为第一个分享的人</div>'}</div></div>`}
function postMini(p){return `<div class="panel" onclick="go('post','${p.id}')"><b>${esc(p.author)}</b><p>${esc(p.text)}</p><span class="muted">♡ ${p.likes}　评论 ${p.comments}</span></div>`}
function match(){return `<div class="pagehead"><button class="back" onclick="go('detail','${state.selectedEvent}')">‹</button><h1>找搭子</h1><span></span></div><div class="content"><p class="muted">告诉我们你的想法，约 1 分钟</p>${[['一起做什么？',['看演出','逛展','拍照','吃饭']],['想要什么状态？',['安静','聊聊天','一起拍照','都可以']],['什么时候碰到？',['提前到','准时到','结束后']],['关系期待？',['普通搭子','兴趣交流','长期搭子']]].map(([t,opts])=>`<div class="field"><label>${t}</label><div class="options">${opts.map((o,i)=>`<span class="option ${i===0?'sel':''}" onclick="selectOption(this)">${o}</span>`).join('')}</div></div>`).join('')}<button class="btn" onclick="go('matching')">开始匹配</button></div>`}
function matching(){setTimeout(()=>{if(state.view==='matching'){state.view='results';render()}},1200);return `<div class="dark" style="min-height:calc(100vh - 0px);padding:25px;color:white"><div class="pagehead" style="padding:0 0 20px"><button class="back" style="color:white" onclick="go('home')">‹</button><span>正在寻找</span><span>＋</span></div><div style="height:300px;display:grid;place-items:center"><div style="width:190px;height:190px;border:2px solid #9b62ff;border-radius:50%;display:grid;place-items:center;font-size:42px;color:#c8ff32">✦</div></div><h1>正在寻找<br>与你同场的人…</h1><p>活动匹配 ✓<br>时间匹配 ✓<br>兴趣匹配 ✓<br>关系偏好 ✓</p></div>`}
function results(){return `<div class="pagehead"><button class="back" onclick="go('home')">‹</button><span></span><span></span></div><div class="content"><h1>找到 3 位<br>同场搭子</h1>${users.map(u=>`<div class="result" onclick="go('user','${u.id}')"><div class="avatar"></div><div><b>${u.name}</b><br><span class="muted">${u.age} · 上海<br>${u.interests.join(' / ')}</span></div><span class="score">${u.score}%</span></div><button class="btn lime" onclick="event.stopPropagation();go('chat','${u.id}')">和 TA 同场</button>`).join('')}</div>`}
function user(){const u=users.find(x=>x.id===state.selectedUser)||users[0];return `<div class="companion-screen"><div class="pagehead"><button class="back" onclick="go('results')">‹</button><span>⋯</span></div><div class="content"><div class="detailhero" style="height:500px;background-image:url('https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=88')"><div><small>同场搭子</small><h1>${u.name}</h1></div></div><div class="panel"><h2>${u.name} · ${u.age}</h2><p>${esc(u.bio)}</p><div class="options">${u.interests.map(i=>`<span class="option sel">${i}</span>`).join('')}</div><p class="muted">共同参加过 ${u.common} 次活动 · 匹配 ${u.score}%</p></div><button class="btn lime" onclick="go('chat','${u.id}')">发起聊天</button><button class="btn" onclick="toast('已发送同行邀请')">和 TA 同场</button></div></div>`}
function chat(){const u=users.find(x=>x.id===state.selectedUser)||users[0];return `<div class="pagehead"><button class="back" onclick="go('user','${u.id}')">‹</button><b>${u.name}</b><span>◎</span></div><div class="content" style="padding-bottom:150px"><div class="panel"><span class="muted">今天</span><p>你好！看到你也要去这场活动。</p></div>${state.chat.filter(m=>m.user===u.id).map(m=>`<div class="panel" style="background:${m.me?'var(--lime)':'var(--card)'};margin-left:${m.me?'35%':'0'}">${esc(m.text)}</div>`).join('')}</div><div style="position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:min(100% - 32px,398px);display:flex;gap:7px"><input id="msg" class="input" placeholder="输入消息…"><button class="smallbtn primary" onclick="sendMsg('${u.id}')">发送</button></div>`}
function circle(){const feedPosts=posts.filter(p=>p.feed===state.postTab);return `<div class="pagehead"><h1>圈子</h1><div><button class="icon" onclick="go('search')">⌕</button><button class="icon" onclick="go('create')">＋</button></div></div><div class="tabs">${[['recommend','推荐'],['follow','关注']].map(([k,l])=>`<div class="tab ${state.postTab===k?'active':''}" onclick="state.postTab='${k}';render()">${l}</div>`).join('')}</div><div class="content" style="padding:0 0 75px">${feedPosts.map(p=>`<article class="post"><div class="posthead"><img class="avatar" style="width:34px;height:34px;object-fit:cover" src="${p.avatar}" alt="${p.author}头像"><b onclick="go('profile')">${p.author}</b><button class="smallbtn" style="margin-left:auto" onclick="toggleFollow('${p.author}')">${state.followed[p.author]?'已关注':'关注'}</button></div><div class="posttext" onclick="go('post','${p.id}')">${esc(p.text)}</div><img class="postimg" src="${p.image}" alt="${p.author}发布的活动图片" loading="lazy" onclick="go('post','${p.id}')"><div class="postactions"><span onclick="toggleLike('${p.id}')">${state.liked[p.id]?'♥':'♡'} ${p.likes+(state.liked[p.id]?1:0)}</span><span onclick="go('post','${p.id}')">评论 ${p.comments}</span><span onclick="toggleSave('${p.id}')">${state.saved[p.id]?'已收藏':'收藏'}</span><span onclick="toast('已复制帖子链接')">分享</span></div></article>`).join('')}</div>${nav('circle')}`}
function post(){const p=posts.find(x=>x.id===state.selectedEvent)||posts[0];const e=events.find(x=>x.id===p.eventId);return `<div class="pagehead"><button class="back" onclick="go('circle')">‹</button><span>⋯</span></div><div class="content"><div class="panel"><div class="posthead"><div class="avatar"></div><b>${p.author}</b></div><div class="posttext">${esc(p.text)}</div><div class="postimg"></div><div class="postactions">♡ ${p.likes}　评论 ${p.comments}　收藏</div></div><div class="panel" onclick="go('detail','${e.id}')"><b>关联活动：${e.title}</b><p class="muted">${e.date} · ${e.venue}</p></div><div class="sectiontitle"><h2>评论</h2></div><input class="input" placeholder="写下你的评论" onkeydown="if(event.key==='Enter'){toast('评论已发布');this.value=''}"><div class="empty">暂无更多评论</div></div>`}
function create(){return `<div class="pagehead"><button class="back" onclick="go('circle')">‹</button><h1>发布内容</h1><span></span></div><div class="content"><div class="field"><label>内容类型</label><div class="options"><span class="option sel">活动体验</span><span class="option">找搭子</span><span class="option">搭子回顾</span></div></div><textarea id="postText" class="input" placeholder="分享你的活动体验…"></textarea><div class="field"><label>关联活动</label><select id="postEvent" class="input">${events.map(e=>`<option value="${e.id}">${e.title}</option>`).join('')}</select></div><button class="btn lime" onclick="publish()">发布</button></div>`}
function profile(){return `<div class="pagehead"><h1>我的</h1><button class="icon" onclick="toggleMenu()">☰</button></div><div class="content"><div class="panel" role="button" tabindex="0" onclick="go('profile-card')" onkeydown="if(event.key==='Enter')go('profile-card')"><div class="profile" style="display:flex;gap:12px;align-items:center"><div class="avatar" style="width:70px;height:70px"></div><div><h2 style="margin:0">云朵</h2><span class="muted">22 · 上海</span><p class="muted">去你想去的现场，遇见同频的人。</p></div></div><div class="muted" style="margin-top:10px">点击查看个人名片和发布内容 ›</div></div><div class="panel" onclick="go('activities')"><b>我的活动</b><p class="muted">即将参加 2　·　已完成 8</p></div><div class="panel" onclick="go('companions')"><b>我的搭子</b><p class="muted">历史搭子 6　·　共同活动记录</p></div><div class="panel"><b>匹配偏好</b><p class="muted">兴趣标签　社交方式　到场时间</p></div></div>${nav('profile')}`}
function profileCard(){return `<div class="pagehead"><button class="back" onclick="go('profile')">‹</button><span>个人名片</span><button class="icon" onclick="go('edit')">⋯</button></div><div class="content"><div class="panel" style="text-align:center"><div class="avatar" style="width:86px;height:86px;margin:auto"></div><h1 style="margin:10px 0 4px">云朵</h1><div class="muted">22 · 上海</div><p>去你想去的现场，遇见同频的人。</p><div class="options" style="justify-content:center"><span class="option sel">Indie</span><span class="option sel">展览</span><span class="option">摄影</span></div><div style="display:flex;justify-content:space-around;margin-top:15px"><div><b>8</b><br><span class="muted">参加活动</span></div><div><b>6</b><br><span class="muted">历史搭子</span></div><div><b>24</b><br><span class="muted">获赞</span></div></div></div><div class="tabs" style="margin:0"><div class="tab active">帖子</div><div class="tab" onclick="go('activities')">活动</div><div class="tab" onclick="go('companions')">搭子</div></div>${posts.filter(p=>p.author==='云朵').map(postMini).join('')||'<div class="empty">你还没有发布帖子，去圈子分享一次活动体验吧</div>'}<div class="panel"><b>我的公开内容</b><p class="muted">你发布的活动体验、找搭子需求和搭子回顾会展示在这里。</p></div></div>`}
function edit(){return `<div class="pagehead"><button class="back" onclick="go('profile')">‹</button><h1>编辑主页</h1><button class="icon" onclick="toast('已保存')">✓</button></div><div class="content"><div class="panel"><label class="muted">头像</label><div class="avatar" style="width:76px;height:76px;margin:10px 0"></div><button class="smallbtn" onclick="toast('请选择图片（MVP占位）')">更换头像</button></div><div class="field"><label>昵称</label><input class="input" value="云朵"></div><div class="field"><label>个性签名</label><textarea class="input">去你想去的现场，遇见同频的人。</textarea></div><div class="field"><label>兴趣标签</label><div class="options"><span class="option sel">Indie</span><span class="option sel">展览</span><span class="option">摄影</span></div></div><button class="btn lime" onclick="toast('资料已保存');go('profile')">保存修改</button></div>`}
function activities(){return `<div class="pagehead"><button class="back" onclick="go('profile')">‹</button><h1>我的活动</h1><span></span></div><div class="content"><div class="tabs" style="margin:0"><div class="tab active">计划参加</div><div class="tab">进行中</div><div class="tab">已完成</div></div>${events.slice(0,5).map(eventCard).join('')}</div>`}
function companions(){return `<div class="pagehead"><button class="back" onclick="go('profile')">‹</button><h1>历史搭子</h1><span></span></div><div class="content">${users.map(u=>`<div class="result" onclick="go('user','${u.id}')"><div class="avatar"></div><div><b>${u.name}</b><br><span class="muted">共同参加过 ${u.common} 次活动</span></div></div>`).join('')}</div>`}
function search(){const q=state.search.toLowerCase();const rs=events.filter(e=>(e.title+e.typeLabel+e.venue).toLowerCase().includes(q));return `<div class="pagehead"><button class="back" onclick="go('home')">‹</button><h1>搜索</h1><span></span></div><div class="content"><input id="searchInput" class="input" autofocus placeholder="搜索活动、用户、帖子" value="${esc(state.search)}" oninput="state.search=this.value;render()"><div class="sectiontitle"><h2>${q?'搜索结果':'热门搜索'}</h2></div>${q?(rs.length?rs.map(eventCard).join(''):'<div class="empty">没有找到相关内容</div>'):'<div class="options"><span class="option" onclick="state.search=\'演唱会\';render()">演唱会</span><span class="option" onclick="state.search=\'展览\';render()">展览</span><span class="option" onclick="state.search=\'Livehouse\';render()">Livehouse</span></div>'}</div>`}
function notifications(){return `<div class="pagehead"><button class="back" onclick="go('home')">‹</button><h1>消息</h1><span></span></div><div class="content"><div class="panel">小满回复了你的消息 <span class="muted">刚刚</span></div><div class="panel">有人赞了你的帖子 <span class="muted">10分钟前</span></div><div class="panel">活动提醒：陈粒巡演还有 3 天 <span class="muted">今天</span></div></div>`}
function settings(){return `<div class="pagehead"><button class="back" onclick="go('profile')">‹</button><h1>设置</h1><span></span></div><div class="content"><div class="panel"><div class="menuitem" onclick="setTheme()">夜间模式 <span class="muted">${state.settings.theme==='dark'?'已开启':'关闭'}</span></div><div class="menuitem" onclick="state.settings.eye=!state.settings.eye;save();render();toast(state.settings.eye?'护眼模式已开启':'护眼模式已关闭')">护眼模式 <span class="muted">${state.settings.eye?'已开启':'关闭'}</span></div><div class="menuitem" onclick="setFont()">字体大小 <span class="muted">${state.settings.font}</span></div><div class="menuitem" onclick="toast('个性化推荐设置已打开')">个性化推荐</div><div class="menuitem" onclick="backup()">导出本地备份</div><div class="menuitem" onclick="restore()">导入本地备份</div></div></div>`}
function menu(){return state.menu?`<div class="menu" onclick="toggleMenu()"><div class="drawer" onclick="event.stopPropagation()"><h2>功能菜单</h2><div class="menuitem" onclick="go('notifications');toggleMenu()">消息</div><div class="menuitem" onclick="toast('暂无新的活动提醒')">活动提醒</div><div class="menuitem" onclick="toast('收藏已打开')">我的收藏</div><div class="menuitem" onclick="toast('浏览历史已打开')">浏览历史</div><div class="menuitem" onclick="go('settings');toggleMenu()">设置</div></div></div>`:''}
function render(){document.body.classList.toggle('dark',state.settings.theme==='dark');document.body.style.filter=state.settings.eye?'sepia(.12) saturate(.85)':'none';document.body.style.fontSize=state.settings.font==='large'?'18px':'';let html=state.view==='home'?home():state.view==='detail'?detail():state.view==='match'?match():state.view==='matching'?matching():state.view==='results'?results():state.view==='user'?user():state.view==='chat'?chat():state.view==='circle'?circle():state.view==='post'?post():state.view==='create'?create():state.view==='profile'?profile():state.view==='profile-card'?profileCard():state.view==='edit'?edit():state.view==='activities'?activities():state.view==='companions'?companions():state.view==='search'?search():state.view==='notifications'?notifications():settings();$('#app').innerHTML=html+menu()}
function go(v,id){state.view=v;if(id){if(v==='detail'||v==='match')state.selectedEvent=id;if(v==='user'||v==='chat')state.selectedUser=id;if(v==='post')state.selectedEvent=id}render()}function setCat(c){state.category=c;render()}function toggleMenu(){state.menu=!state.menu;render()}function moreCats(){toast('更多：音乐节、话剧、脱口秀、艺术市集')}
function toggleSave(id){state.saved[id]=!state.saved[id];save();render();toast(state.saved[id]?'已收藏':'已取消收藏')}function toggleLike(id){state.liked[id]=!state.liked[id];save();render()}function toggleFollow(id){state.followed[id]=!state.followed[id];save();render();toast(state.followed[id]?'已关注':'已取消关注')}function selectOption(el){el.parentElement.querySelectorAll('.option').forEach(x=>x.classList.remove('sel'));el.classList.add('sel')}function sendMsg(uid){const v=$('#msg').value.trim();if(!v)return;state.chat.push({user:uid,text:v,me:true});save();render();toast('消息已发送')}function publish(){const t=$('#postText').value.trim();if(!t){toast('请先输入内容');return}posts.unshift({id:'p'+Date.now(),author:'云朵',text:t,eventId:$('#postEvent').value,likes:0,comments:0});go('circle');toast('发布成功')}function setTheme(){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save();render()}function setFont(){state.settings.font=state.settings.font==='normal'?'large':'normal';save();render();toast('字体设置已更新')}function backup(){const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tongchang-backup.json';a.click();toast('备份已导出')}function restore(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.liked)state.liked=d.liked;if(d.saved)state.saved=d.saved;if(d.followed)state.followed=d.followed;if(d.settings)state.settings=Object.assign(state.settings,d.settings);if(d.chat)state.chat=d.chat;if(d.comments)state.comments=d.comments;save();render();toast('备份已恢复')}catch(e){toast('备份文件无效')}};r.readAsText(f)};i.click()}load();render();
</script></body></html>
